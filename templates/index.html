<!DOCTYPE html>
<html>

<head>
    <title>BTC Alerts</title>
</head>

<body style="font-family:sans-serif;padding:40px;">

    <h1>BTC Alert Dashboard</h1>

    <form action="/add" method="post">

        <input
            type="hidden"
            name="password"
            value="{{ password }}"
        >

        <input
            type="number"
            step="0.01"
            name="price"
            placeholder="BTC Price"
            required
        >

        <button type="submit">
            Add Alert
        </button>

    </form>

    <h2>Active Alerts</h2>

    <ul>
        {% for alert in alerts %}
            <li>${{ alert }}</li>
        {% endfor %}
    </ul>

</body>

</html>
